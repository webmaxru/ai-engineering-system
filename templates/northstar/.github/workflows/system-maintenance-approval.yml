name: System Maintenance Approval

on:
  workflow_dispatch:
    inputs:
      pull-request:
        description: Pull request number awaiting control-plane approval
        required: true
        type: string
      head-sha:
        description: Immutable implementation commit
        required: true
        type: string
      evidence-run-id:
        description: Publish Evidence run containing the restricted evidence bundle
        required: true
        type: string
      source-run-id:
        description: Governed Change run whose immutable evidence is being evaluated
        required: true
        type: string
      canary-plan-pr-number:
        description: Optional file-backed browser-canary plan PR
        required: false
        type: string
      canary-plan-head-sha:
        description: Optional immutable canary plan head
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: system-maintenance-${{ inputs.head-sha }}
  cancel-in-progress: false

jobs:
  approve:
    if: github.actor == vars.SYSTEM_MAINTENANCE_DISPATCH_APP_LOGIN
    runs-on: ubuntu-latest
    environment: system-maintenance
    env:
      PR_NUMBER: ${{ inputs.pull-request }}
      NORTHSTAR_HEAD_SHA: ${{ inputs.head-sha }}
      NORTHSTAR_RUN_ID: ${{ inputs.source-run-id }}
      EVIDENCE_RUN_ID: ${{ inputs.evidence-run-id }}
      CANARY_PLAN_PR_NUMBER: ${{ inputs['canary-plan-pr-number'] }}
      CANARY_PLAN_HEAD_SHA: ${{ inputs['canary-plan-head-sha'] }}
      NORTHSTAR_TRUSTED_PUBLISHER_APP_ID: ${{ vars.TRUSTED_PUBLISHER_APP_ID }}
      NORTHSTAR_TRUSTED_PUBLISHER_APP_LOGIN: ${{ vars.TRUSTED_PUBLISHER_APP_LOGIN }}
      NORTHSTAR_DISPATCH_APP_ID: ${{ vars.SYSTEM_MAINTENANCE_DISPATCH_APP_ID }}
      NORTHSTAR_DISPATCH_APP_LOGIN: ${{ vars.SYSTEM_MAINTENANCE_DISPATCH_APP_LOGIN }}
    steps:
      # workflow_dispatch is sent by a dedicated automation identity. The human
      # environment reviewer is therefore not the deployment initiator.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: publisher-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.TRUSTED_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.TRUSTED_PUBLISHER_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-administration: read
          permission-contents: read
          permission-environments: read
          permission-issues: write
          permission-pull-requests: write
          permission-organization-secrets: ${{ github.event.repository.owner.type == 'Organization' && 'read' || '' }}
          permission-secrets: read
          permission-statuses: write
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: northstar-system-maintenance-evidence
          path: incoming-maintenance-evidence
          run-id: ${{ inputs.evidence-run-id }}
          github-token: ${{ github.token }}
      - run: >-
          node scripts/import-evidence-artifacts.mjs
          --from incoming-maintenance-evidence
          --maintenance
      - name: Verify trusted run provenance
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: node scripts/verify-maintenance-runs.mjs
      - name: Refresh mutable hosted controls after environment approval
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: |
          MERGED_SOURCE_ARGS=()
          if [ -n "$CANARY_PLAN_PR_NUMBER" ] || [ -n "$CANARY_PLAN_HEAD_SHA" ]; then
            if [ -z "$CANARY_PLAN_PR_NUMBER" ] || [ -z "$CANARY_PLAN_HEAD_SHA" ]; then
              echo "Both immutable canary plan identities are required."
              exit 1
            fi
            MERGED_SOURCE_ARGS+=(--allow-merged)
          fi
          node scripts/resolve-workflow-pr.mjs --sha "$NORTHSTAR_HEAD_SHA" "${MERGED_SOURCE_ARGS[@]}"
          npm run contract:from-pr -- --pr "$PR_NUMBER"

          set +e

          rm -f artifacts/candidate-plan.json artifacts/approved-plan.json artifacts/checks/plan-approval.json
          node scripts/check-plan.mjs --pr "$PR_NUMBER" --expected-head "$NORTHSTAR_HEAD_SHA"
          PLAN_STATUS=$?
          if [ "$PLAN_STATUS" -eq 0 ] && [ -f artifacts/plan.json ]; then
            cp artifacts/plan.json artifacts/candidate-plan.json
          fi

          ISSUE=$(node -p "require('./artifacts/task-contract.json').source.issue")
          node scripts/select-execution-plan.mjs \
            --issue "$ISSUE" \
            --pr "$PR_NUMBER" \
            --expected-head "$NORTHSTAR_HEAD_SHA" \
            --expected-plan artifacts/candidate-plan.json \
            --record-approval \
            "${MERGED_SOURCE_ARGS[@]}"
          SELECTION_STATUS=$?
          node scripts/evidence-record.mjs \
            --id plan-contract \
            --job plan-contract \
            --category policy \
            --status "$([ "$PLAN_STATUS" -eq 0 ] && [ "$SELECTION_STATUS" -eq 0 ] && echo pass || echo fail)" \
            --artifact artifacts/candidate-plan.json

          node scripts/check-scope.mjs --pr "$PR_NUMBER" --expected-head "$NORTHSTAR_HEAD_SHA" "${MERGED_SOURCE_ARGS[@]}"
          SCOPE_STATUS=$?
          node scripts/evidence-record.mjs \
            --id scope-policy \
            --job scope-policy \
            --category policy \
            --status "$([ "$SCOPE_STATUS" -eq 0 ] && echo pass || echo fail)" \
            --artifact artifacts/scope-report.json

          node scripts/check-human-review.mjs --pr "$PR_NUMBER" --expected-head "$NORTHSTAR_HEAD_SHA"
          REVIEW_STATUS=$?
          node scripts/evidence-record.mjs \
            --id human-review \
            --job human-review \
            --category approval \
            --status "$([ "$REVIEW_STATUS" -eq 0 ] && echo pass || echo fail)"

          rm -f artifacts/validation-authority-report.json
          node scripts/check-validation-authority.mjs --pr "$PR_NUMBER" --expected-head "$NORTHSTAR_HEAD_SHA"
          AUTHORITY_STATUS=$?
          if [ "$AUTHORITY_STATUS" -ne 3 ]; then
            echo "Validation-authority did not return the expected control-plane-change result."
            VERIFY_STATUS=1
          else
            node -e "
              const fs = require('node:fs');
              const report = JSON.parse(fs.readFileSync('artifacts/validation-authority-report.json', 'utf8'));
              if (
                report.schema !== 'northstar/validation-authority-report/1' ||
                report.pullRequest !== Number(process.env.PR_NUMBER) ||
                report.headSha !== process.env.NORTHSTAR_HEAD_SHA ||
                report.ok !== false ||
                report.changedAuthority.length === 0
              ) {
                throw new Error('No immutable control-plane change is awaiting maintenance approval');
              }
            "
            VERIFY_STATUS=$?
          fi
          node scripts/evidence-record.mjs \
            --id validation-authority \
            --job validation-authority \
            --category approval \
            --status "$([ "$VERIFY_STATUS" -eq 0 ] && echo pass || echo fail)" \
            --summary "Approved through the protected system-maintenance environment" \
            --artifact artifacts/validation-authority-report.json
          exit 0
      - id: execution-plan
        name: Revalidate mutable state at the publication boundary
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: |
          MERGED_SOURCE_ARGS=()
          if [ -n "$CANARY_PLAN_PR_NUMBER" ] || [ -n "$CANARY_PLAN_HEAD_SHA" ]; then
            if [ -z "$CANARY_PLAN_PR_NUMBER" ] || [ -z "$CANARY_PLAN_HEAD_SHA" ]; then
              echo "Both immutable canary plan identities are required."
              exit 1
            fi
            MERGED_SOURCE_ARGS+=(--allow-merged)
          fi
          node scripts/resolve-workflow-pr.mjs --sha "$NORTHSTAR_HEAD_SHA" "${MERGED_SOURCE_ARGS[@]}"
          npm run contract:from-pr -- --pr "$PR_NUMBER"

          node scripts/check-plan.mjs --pr "$PR_NUMBER" --expected-head "$NORTHSTAR_HEAD_SHA"
          node scripts/select-execution-plan.mjs \
            --pr "$PR_NUMBER" \
            --expected-head "$NORTHSTAR_HEAD_SHA" \
            --expected-plan artifacts/plan.json \
            --record-approval \
            "${MERGED_SOURCE_ARGS[@]}"
          node scripts/evidence-record.mjs \
            --id plan-contract \
            --job plan-contract \
            --category policy \
            --status pass \
            --artifact artifacts/candidate-plan.json

          node scripts/check-scope.mjs --pr "$PR_NUMBER" --expected-head "$NORTHSTAR_HEAD_SHA" "${MERGED_SOURCE_ARGS[@]}"
          node scripts/evidence-record.mjs \
            --id scope-policy \
            --job scope-policy \
            --category policy \
            --status pass \
            --artifact artifacts/scope-report.json

          node scripts/check-human-review.mjs --pr "$PR_NUMBER" --expected-head "$NORTHSTAR_HEAD_SHA"
          node scripts/evidence-record.mjs \
            --id human-review \
            --job human-review \
            --category approval \
            --status pass

          npm run governance:online
          node scripts/evidence-record.mjs \
            --id repository-controls \
            --job repository-controls \
            --category policy \
            --status pass \
            --artifact artifacts/repository-controls-report.json
      - name: Verify the browser-only plan canary
        if: >-
          inputs['canary-plan-pr-number'] != '' ||
          inputs['canary-plan-head-sha'] != ''
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: node scripts/browser-plan-canary.mjs
      - if: always()
        env:
          SELECTION_OUTCOME: ${{ steps.execution-plan.outcome }}
          PLAN_PATH: ${{ steps.execution-plan.outputs.plan_path }}
        run: |
          if [ "$SELECTION_OUTCOME" != "success" ]; then
            rm -f artifacts/plan.json artifacts/approved-plan.json artifacts/candidate-plan.json
            PLAN_PATH=artifacts/plan.json
          fi
          node scripts/build-execution-report.mjs --hosted --plan "$PLAN_PATH"
      - run: node scripts/validate-maintenance-decision.mjs
      - env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: node scripts/publish-evidence.mjs --pr "$PR_NUMBER"
      - uses: actions/upload-artifact@v7
        with:
          name: northstar-system-maintenance-approved-report
          path: artifacts/report.json
          if-no-files-found: error
          retention-days: 90
      - env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: node scripts/publish-acceptance-status.mjs
