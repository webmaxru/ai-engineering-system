name: Governance Review

on:
  schedule:
    # CUSTOMIZE the review cadence to the repository's operating schedule.
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit visible controls and report unavailable administration APIs
        env:
          GH_TOKEN: ${{ github.token }}
          # CUSTOMIZE these repository variables for separately approved App identities.
          # Identity metadata does not grant administration or secret-inventory access.
          NORTHSTAR_TRUSTED_PUBLISHER_APP_LOGIN: ${{ vars.TRUSTED_PUBLISHER_APP_LOGIN }}
          NORTHSTAR_TRUSTED_PUBLISHER_APP_ID: ${{ vars.TRUSTED_PUBLISHER_APP_ID }}
          NORTHSTAR_DISPATCH_APP_LOGIN: ${{ vars.SYSTEM_MAINTENANCE_DISPATCH_APP_LOGIN }}
          NORTHSTAR_DISPATCH_APP_ID: ${{ vars.SYSTEM_MAINTENANCE_DISPATCH_APP_ID }}
        run: npm run governance:online
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: governance-review
          path: artifacts/repository-controls-report.json
          if-no-files-found: error
          retention-days: 90
